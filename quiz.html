<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Ability Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
            <div class="page">

  <h1>FÄHIGKEIEN QUIZ</h1>

  <div id="quiz-container">
    <p id="quiz-question">Welcher Agent hat diese Fähigkeit?</p>

    <div id="ability-icon-wrapper">
      <img id="ability-icon" alt="Ability Icon">
    </div>

    <div id="answer-buttons">
      <button class="answer-btn"></button>
      <button class="answer-btn"></button>
      <button class="answer-btn"></button>
      <button class="answer-btn"></button>
    </div>

    <p id="quiz-feedback"></p>
    <p id="quiz-score"></p>
    <button id="next-question-btn">Nächste Frage</button>
  </div>
            </div>
  <div class="right-buttons">
    <button id="backBtn">Zurück</button>
    <button id="themeToggle">Light Mode</button>
  </div>

  <script src="main.js"></script>
</body>
</html>
