<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Valorant Weapons</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
          <div class="page">

  <h1>Valorant Weapons</h1>

  <div class="toolbar">
    <select id="weaponSort">
      <option value="name">Alphabetisch</option>
      <option value="price">Nach Preis</option>
    </select>
  </div>

  <input
    type="text"
    id="globalSearch"
    placeholder="Suchen..."
  >

  <ul id="weapons"></ul>
          </div>
  <div class="right-buttons">
    <button id="backBtn">Zurück</button>
    <button id="themeToggle">Light Mode</button>
  </div>
  <script src="main.js"></script>
</body>
</html>
