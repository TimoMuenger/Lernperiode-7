<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Vergleich</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <h1>Vergleichen</h1>

    <h2>Waffen vergleichen</h2>
    <div class="compare-row">
      <div class="left-selects">
        <select id="weaponA"></select>
        <select id="weaponB"></select>
      </div>
    </div>
    <button id="compareWeaponsBtn">Waffenvergleichen</button>

    <hr>

    <h2>Agents vergleichen</h2>
    <div class="compare-row">
      <div class="left-selects">
        <select id="agentA"></select>
        <select id="agentB"></select>
      </div>
    </div>
    <button id="compareAgentsBtn">Agents vergleichen</button>

    <div class="right-buttons">
      <button id="backBtn">Zurück</button>
      <button id="themeToggle">Light Mode</button>
    </div>
  </div>

  <div id="resultWeapons"></div>
  <div id="resultAgents"></div>

  <script src="main.js"></script>
</body>
</html>
