<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Generator | Valorant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">

  </header>

  <main class="container">
    <h1>Random Generator</h1>

    <section class="random-grid">
      <div class="random-card">
        <div class="random-card-header">
          <h2>Random Agent</h2>
          <button id="btn-random-agent" class="btn">Generieren</button>
        </div>
        <div id="random-agent" class="random-result">
          <p class="muted">Klick auf „Generieren“.</p>
        </div>
      </div>

      <div class="random-card">
        <div class="random-card-header">
          <h2>Random Waffe</h2>
          <button id="btn-random-weapon" class="btn">Generieren</button>
        </div>
        <div id="random-weapon" class="random-result">
          <p class="muted">Klick auf „Generieren“.</p>
        </div>
      </div>

      <div class="random-card">
        <div class="random-card-header">
          <h2>Random Map</h2>
          <button id="btn-random-map" class="btn">Generieren</button>
        </div>
        <div id="random-map" class="random-result">
          <p class="muted">Klick auf „Generieren“.</p>
           <div class="right-buttons">

    <button id="backBtn">Zurück</button>
    <button id="themeToggle">Light Mode</button>
  </div>
        </div>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
